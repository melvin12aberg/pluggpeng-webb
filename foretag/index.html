<head>

<title>Pluggpeng för företag</title>
<!-- Mall. bygg-publik.js fyller i Supabase och bilderna och skriver pluggpeng-webb/foretag/index.html -->
<style>
@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url(/fonts/Fredoka-latin.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:200 1000;font-display:swap;src:url(/fonts/Nunito-latin.woff2) format('woff2')}
:root{
  --bg:#F4F6FB;--surface:#fff;--surface-2:#EDF0F8;--ink:#1E2440;--muted:#646C86;--line:#E1E5F0;
  --primary:#4C6EF5;--primary-soft:#E5EBFF;--coin:#F7B731;--coin-soft:#FFF3D1;--coin-ink:#7A4E00;
  --good:#16A34A;--good-soft:#DCFCE7;--bad:#DC2626;--bad-soft:#FEE2E2;--warn:#B45309;--warn-soft:#FEF3C7;
  --shadow:0 1px 2px rgba(30,36,64,.06),0 10px 30px rgba(30,36,64,.08);
  --display:"Fredoka","Avenir Next Rounded",system-ui,sans-serif;--font:"Nunito","Segoe UI",system-ui,sans-serif;
  --pc:#4C6EF5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121528;--surface:#1B2038;--surface-2:#252B48;--ink:#EEF0FA;--muted:#A3AAC6;--line:#2E355A;
  --primary:#8EA4FF;--primary-soft:#262F5C;--coin-soft:#3D3218;--coin-ink:#FFD978;
  --good:#4ADE80;--good-soft:#16352A;--bad:#F87171;--bad-soft:#3F1D24;--warn:#FBBF24;--warn-soft:#3A2E12;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(120deg,#4C6EF5,#7A5CF0 60%,#A35CE8);color:#fff;padding:18px 0 70px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.brand small{font-family:var(--font);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px}
.top .who{display:flex;align-items:center;gap:10px;font-weight:800}
.mono{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pc);color:#fff;font-weight:900;font-size:13px;overflow:hidden;flex:none}
.mono.img{background:#fff}
.mono img{width:84%;height:84%;object-fit:contain}
main{margin-top:-52px;padding-bottom:140px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.intro{display:grid;gap:14px}
.intro h1{font-size:30px}
.intro p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;display:grid;gap:2px}
.steps li::before{content:counter(s);font-family:var(--display);font-size:18px;color:var(--primary)}
.steps li small{font-weight:600;color:var(--muted)}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
.intro-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin:22px 0 14px;flex-wrap:wrap}
.tab{border:0;background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.tab.on{background:var(--ink);color:var(--surface)}
.tab .n{font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 8px}
.tab.on .n{background:rgba(255,255,255,.18);color:inherit}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.side{position:sticky;top:16px;display:grid;gap:10px}
@media (max-width:900px){.side{position:static}}
.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rules{background:var(--primary-soft);border-radius:16px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.rules b{font-family:var(--display);font-size:15px}
.rules ul{margin:0;padding-left:18px}
.list{display:grid;gap:8px;margin-top:14px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.item.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.item .t{flex:1;min-width:0;display:grid}
.item .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.utkast{background:var(--surface-2);color:var(--muted)}
.pill.inskickat{background:var(--primary-soft);color:var(--primary)}
.pill.andras{background:var(--warn-soft);color:var(--warn)}
.pill.godkand{background:var(--good-soft);color:var(--good)}
.pill.aktiv{background:var(--good);color:#fff}
.pill.pausad{background:var(--surface-2);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
form.ed{display:grid;gap:14px;margin-top:16px;padding-top:16px;border-top:1.5px solid var(--line)}
.f{display:grid;gap:6px;font-weight:800;font-size:14px}
.f small{font-weight:600;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.pics button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:4px;cursor:pointer;aspect-ratio:1}
.pics button.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.pics svg{width:100%;height:100%}
.wrongs{display:grid;gap:6px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.note b{display:block}
.locked{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);font-weight:700}
.ed-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-btns .sp{flex:1}
/* Förhandsvisningen: samma utseende som i appen */
.phone{background:linear-gradient(160deg,#4C6EF5,#7A5CF0);border-radius:30px;padding:16px;box-shadow:var(--shadow)}
.phone .scr{background:var(--bg);border-radius:20px;padding:14px;display:grid;gap:12px;min-height:260px}
.ad{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prod{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.prod-art{position:relative;background:var(--surface-2);border-radius:14px;aspect-ratio:1;display:grid;place-items:center}
.prod-art svg{width:78%;height:78%}
.prod-art .mono{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:8px}
.prod h3{font-size:18px}
.price{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--coin-ink);background:var(--coin-soft);border-radius:999px;padding:3px 10px;margin-top:6px;font-size:14px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,var(--coin) 60%,#D99A0B);display:inline-block}
.od{background:var(--surface);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.od h3{font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--surface-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.od p{margin:0}
.terms{font-size:12.5px;color:var(--muted);display:grid;gap:4px;border-top:1.5px solid var(--line);padding-top:8px}
.terms p{margin:0}
.case{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border-left:5px solid var(--pc)}
.case-brand{display:flex;gap:10px;align-items:center;padding:12px 14px;background:color-mix(in srgb,var(--pc) 8%,var(--surface))}
.case-brand b{display:block}
.qq{font-family:var(--display);font-size:20px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;cursor:pointer;font-weight:700;width:100%}
.opt i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.expl{background:var(--surface);border-radius:14px;padding:12px;font-size:14px}
.pt{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--pc)}
.pt .mono{width:56px;height:56px;border-radius:14px;font-size:18px}
.pt h3{font-size:22px}
.pt p{margin:4px 0 0;font-size:14px}
.hint{font-size:13px;color:var(--muted);text-align:center}
.submit{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -6px 30px rgba(30,36,64,.12);padding:12px 0;z-index:5}
.submit .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.submit .txt{flex:1;min-width:200px;font-weight:700;font-size:14px}
.submit .txt small{display:block;color:var(--muted);font-weight:600}
.submit .input{max-width:220px}
.peek{display:none}
@media (max-width:900px){
  .peek{display:inline-flex}
  .submit .txt small{display:none}
  .submit .wrap{gap:8px}
  .submit .txt{flex-basis:100%;min-width:0}
  .submit .input{flex:1;max-width:none;min-width:0}
}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:800;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.full{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.full > div{max-width:440px;display:grid;gap:12px}
.full .big{font-size:44px}
</style>
</head>

async function rpc(fn, args){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(args)});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j && j.message || "Något gick fel");
  return j;
}

// Svaren blandas med en fast ordning per fråga, som i appen
function shuffled(q){
  const all = [q.answer || "Rätt svar", ...q.wrong.map((w,i)=>w || "Fel svar " + (i+1))];
  const h = s => { let x = 2166136261; for(const c of s) x = Math.imul(x ^ c.charCodeAt(0), 16777619); return x >>> 0; };
  return all.map((t,i)=>({t, ok:i===0, k:h((q.question||"") + t + i)})).sort((a,b)=>a.k-b.k);
}
function questionPreview(q){
  const name = esc(P().name), opts = shuffled(q);
  return `<div class="case"><div class="case-brand">${logo(38)}<div><b>Bonusfråga · Om ${name}</b><span class="ad">Annons · I samarbete med ${name}</span></div></div></div>

  <div class="opts">${opts.map((o,i)=>`<button type="button" class="opt ${answered!==null ? (o.ok ? "ok" : answered===i ? "no" : "") : ""}" data-try="${i}"><i>${"ABCD"[i]}</i>${esc(o.t)}</button>`).join("")}</div>

}

  const el = $("#warn"); if(!el || !form) return;
  let w = "";
  if(tab==="questions" && PUSH_Q.test([form.question, form.answer, form.explanation, ...form.wrong].join(" "))) w = "Det låter som försäljning. Bonusfrågor ska bara handla om fakta, inte om att köpa något. Vi kan behöva ändra frågan.";
  if(tab==="offers" && PUSH_O.test([form.title, form.text, form.terms].join(" "))) w = "Undvik ord som skapar stress, till exempel ”bara idag” eller ”skynda”. Många elever är 13–15 år.";
  if(tab==="profile" && PUSH_O.test(form.info || "")) w = "Undvik säljtext. Texten ska bara berätta om er.";
  el.innerHTML = w ? `<div class="warn">${w}</div>` : "";
}
function refreshPreview(){ const el = $("#pv"); if(el) el.innerHTML = previewHTML(); checkWarn(); }

function openTab(k){
  tab = k; sel = null; answered = null;
  if(k==="profile"){ const p = D.profile || {}; form = {info:p.info || P().info || "", industry:p.industry || P().industry || "", color:p.color || P().color, logo:p.logo || null}; }
  else form = null;
  render(); checkWarn();
}
function openItem(id){
  sel = id; answered = null;
  if(tab==="offers"){ const o = D.offers.find(x=>x.id===id); form = {...blankOffer(), ...Object.fromEntries(Object.entries(o).map(([k,v])=>[k, v ?? ""]))}; }
  else { const q = D.questions.find(x=>x.id===id); form = {...blankQ(), ...q, source:q.source || "", wrong:[...q.wrong]}; }
  render(); checkWarn();
}
function valid(){
  const f = form;
  if(tab==="offers"){
    if(f.title.trim().length < 2) return "Skriv en rubrik";
    if(f.text.trim().length < 2) return "Skriv en beskrivning";
    if(!(+f.value_kr >= 5 && +f.value_kr <= 2000)) return "Värdet ska vara mellan 5 och 2 000 kr";
    if(f.channel==="webb" && f.web_url && !/^https:\/\//.test(f.web_url)) return "Länken ska börja med https://";
    if(f.starts_on && f.ends_on && f.ends_on < f.starts_on) return "Slutdatum är före startdatum";
  } else if(tab==="questions"){
    if(f.question.trim().length < 5) return "Skriv frågan";
    if(!f.answer.trim()) return "Skriv det rätta svaret";
    if(f.wrong.some(w=>!w.trim())) return "Skriv tre fel svar";
    if(new Set([f.answer, ...f.wrong].map(x=>x.trim().toLowerCase())).size < 4) return "Alla fyra svar måste vara olika";
    if(f.explanation.trim().length < 5) return "Skriv en kort förklaring";
  }
  return null;
}
async function save(){
  const err = valid(); if(err) return toast(err);
  const kind = tab==="offers" ? "offer" : tab==="questions" ? "question" : "profile";
  const data = {...form}; delete data.status;
  if(kind!=="profile") Object.keys(data).forEach(k => { if(typeof data[k]==="string") data[k] = data[k].trim(); });
  try{
    const r = await rpc("portal_save", {p_code:CODE, p_kind:kind, p_data:data});
    Object.assign(D, {offers:r.offers, questions:r.questions, profile:r.profile});
    toast("Sparat som utkast. Glöm inte att skicka in.");
    if(kind==="profile") openTab("profile"); else { openItem(r.id); }
  }catch(e){ toast(e.message); }
}
async function del(){
  if(!confirm("Ta bort det här?")) return;
  try{ const r = await rpc("portal_delete", {p_code:CODE, p_kind:tab==="offers" ? "offer" : "question", p_id:form.id});
    Object.assign(D, {offers:r.offers, questions:r.questions, profile:r.profile}); form = null; sel = null; render(); toast("Borttaget"); }
  catch(e){ toast(e.message); }
}
async function submitAll(){
  const who = ($("#who").value || "").trim(); if(who.length < 2) return toast("Skriv ditt namn");
  if(form && tab!=="profile" && !form.id && (form.title || form.question)) return toast("Spara det du skriver på först");
  if(!confirm(`Skicka in allt som är utkast? Det sparas att ${who} skickade in det. Pluggpeng granskar och hör av sig.`)) return;
  try{ const r = await rpc("portal_submit", {p_code:CODE, p_name:who}); Object.assign(D, {offers:r.offers, questions:r.questions, profile:r.profile}); render(); toast("Tack! Nu granskar vi."); }
  catch(e){ toast(e.message); }
}
// Loggan görs om till en liten bild (högst 256 px)
function readLogo(file){
  return new Promise((ok, no) => {
    const rd = new FileReader(); rd.onerror = no;
    rd.onload = () => {
      const url = rd.result;
      if(file.type==="image/svg+xml" && url.length <= 110000) return ok(url);
      const img = new Image(); img.onerror = no;
      img.onload = () => { const sc = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width*sc)); c.height = Math.max(1, Math.round(img.height*sc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL("image/png"); if(out.length > 110000) out = c.toDataURL("image/webp", .85);
        out.length > 110000 ? no(new Error("för stor")) : ok(out); };
      img.src = url;
    };
    rd.readAsDataURL(file);
  });
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if(!t || !D) return;
  const d = t.dataset;
  if(d.tab){ openTab(d.tab); return; }
  if(d.sel){ openItem(d.sel); return; }
  if(d.new!==undefined){ sel = null; answered = null; form = tab==="offers" ? blankOffer() : blankQ(); render(); return; }
  if(d.cancel!==undefined){ form = null; sel = null; render(); return; }
  if(d.save!==undefined){ save(); return; }
  if(d.del!==undefined){ del(); return; }
  if(d.submit!==undefined){ submitAll(); return; }
  if(d.peek!==undefined){ $(".side").scrollIntoView({behavior:"smooth"}); return; }
  if(d.pic){ form.pic = d.pic; document.querySelectorAll("[data-pic]").forEach(b=>b.classList.toggle("on", b.dataset.pic===d.pic)); refreshPreview(); return; }
  if(d.try!==undefined){ answered = +d.try; refreshPreview(); return; }
});
document.addEventListener("input", e => {
  const t = e.target; if(!form) return;
  if(t.dataset.f){ form[t.dataset.f] = t.value;
    if(t.type==="radio"){ t.closest(".seg").querySelectorAll("label").forEach(l=>l.classList.toggle("on", l.querySelector("input").checked));
      if(t.dataset.f==="channel"){ render(); checkWarn(); return; } }
    if(t.dataset.f==="color") document.documentElement.style.setProperty("--pc", t.value);
    answered = null; refreshPreview(); }
  if(t.dataset.w!==undefined){ form.wrong[+t.dataset.w] = t.value; answered = null; refreshPreview(); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.dataset.logo!==undefined && t.files[0]){
    try{ form.logo = await readLogo(t.files[0]); refreshPreview(); toast("Loggan är tillagd. Spara för att behålla den."); }
    catch(err){ toast("Loggan är för stor eller går inte att läsa"); }
  }
});
boot();
</script>
